spring.application.name=gestionpolizas

# H2 en memoria
spring.datasource.url=jdbc:h2:mem:polizasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2 (para inspeccionar datos en el navegador durante la prueba)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Carga datos de prueba después de que Hibernate cree las tablas
spring.sql.init.mode=always

server.port=8080